<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GITAM Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e;
      --accent: #6ee7b7; --accent2: #818cf8;
      --text: #e2e8f0; --muted: #64748b;
      --O: #6ee7b7; --Aplus: #34d399; --A: #6ee7b7;
      --Bplus: #60a5fa; --B: #93c5fd; --C: #fbbf24; --F: #f87171;
      --mono: 'Space Mono', monospace; --sans: 'Syne', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(rgba(110,231,183,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(110,231,183,.04) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    .page { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 6rem; }
    header { display: flex; align-items: center; gap: 1rem; padding: 2rem 0 2.5rem; border-bottom: 1px solid var(--border); margin-bottom: 2.5rem; }
    .logo { width: 44px; height: 44px; background: var(--accent); clip-path: polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%); animation: spin 20s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    header h1 { font-size: clamp(1.4rem,4vw,2.1rem); font-weight: 800; letter-spacing: -.04em; }
    header h1 span { color: var(--accent); }
    header p { font-family: var(--mono); font-size: .7rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-top: .25rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.75rem; position: relative; overflow: hidden; }
    .card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    label { display: block; font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: .4rem; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--mono); font-size: .9rem; padding: .72rem 1rem; outline: none; transition: border-color .2s, box-shadow .2s; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(110,231,183,.12); }
    input::placeholder { color: var(--muted); }
    .sem-grid { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .4rem; }
    .sem-pill { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--muted); font-family: var(--mono); font-size: .8rem; padding: .48rem .85rem; cursor: pointer; transition: all .15s; user-select: none; }
    .sem-pill:hover { border-color: var(--accent); color: var(--accent); }
    .sem-pill.active { background: var(--accent); border-color: var(--accent); color: #0a0a0f; font-weight: 700; }
    .btn { display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; background: var(--accent); color: #0a0a0f; border: none; border-radius: 8px; font-family: var(--sans); font-size: 1rem; font-weight: 800; padding: .85rem; cursor: pointer; margin-top: 1.25rem; transition: transform .15s, box-shadow .2s; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(110,231,183,.25); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn.loading svg { animation: spin .7s linear infinite; }
    .status-bar { margin-top: .85rem; padding: .6rem 1rem; border-radius: 8px; font-family: var(--mono); font-size: .76rem; display: none; }
    .status-bar.error { display: block; background: rgba(248,113,113,.1); border: 1px solid #f87171; color: #f87171; }
    .status-bar.loading { display: block; background: rgba(110,231,183,.06); border: 1px solid var(--border); color: var(--accent); }
    #results { margin-top: 2.5rem; }
    .fade-in { animation: fadeIn .35s ease both; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .student-banner { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem 1.75rem; margin-bottom: 1.5rem; position: relative; overflow: hidden; }
    .student-banner::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .student-name-big { font-size: clamp(1.2rem,3vw,1.7rem); font-weight: 800; letter-spacing: -.03em; }
    .student-meta { font-family: var(--mono); font-size: .72rem; color: var(--muted); margin-top: .4rem; }
    .student-pills { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
    .spill { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: .3rem .85rem; font-family: var(--mono); font-size: .76rem; }
    .spill strong { color: var(--accent); margin-left: .3rem; }
    .spill.highlight { border-color: var(--accent); }
    .section-title { font-family: var(--mono); font-size: .68rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin: 1.75rem 0 .75rem; display: flex; align-items: center; gap: .6rem; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: .5rem; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    thead th { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: .7rem 1rem; text-align: left; background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.02); }
    tbody td { padding: .65rem 1rem; font-family: var(--mono); font-size: .79rem; }
    .course-name { font-family: var(--sans); font-size: .83rem; font-weight: 600; }
    .code-badge { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: .1rem .4rem; font-size: .68rem; color: var(--muted); margin-top: .2rem; }
    .cat-badge { display: inline-block; border-radius: 4px; padding: .15rem .45rem; font-size: .68rem; font-weight: 700; font-family: var(--mono); }
    .cat-PC { background: rgba(110,231,183,.12); color: var(--accent); }
    .cat-PE { background: rgba(129,140,248,.12); color: var(--accent2); }
    .cat-OE { background: rgba(251,191,36,.1); color: #fbbf24; }
    .g { display: inline-flex; align-items: center; justify-content: center; min-width: 2.2rem; padding: .18rem .45rem; border-radius: 5px; font-weight: 700; font-size: .78rem; font-family: var(--mono); }
    .g-O { background: rgba(110,231,183,.15); color: var(--O); }
    .g-Ap { background: rgba(52,211,153,.12); color: var(--Aplus); }
    .g-A { background: rgba(110,231,183,.1); color: var(--A); }
    .g-Bp { background: rgba(96,165,250,.12); color: var(--Bplus); }
    .g-B { background: rgba(147,197,253,.1); color: var(--B); }
    .g-C { background: rgba(251,191,36,.1); color: var(--C); }
    .g-F { background: rgba(248,113,113,.12); color: var(--F); }
    .g-dash { color: var(--muted); }
    .int-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .6rem; }
    .int-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .75rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .int-name { font-size: .8rem; font-weight: 600; line-height: 1.3; flex: 1; }
    .int-code { font-family: var(--mono); font-size: .65rem; color: var(--muted); }
    .int-mark { font-family: var(--mono); font-size: 1rem; font-weight: 700; flex-shrink: 0; }
    footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--border); text-align: center; font-family: var(--mono); font-size: .68rem; color: var(--muted); }
    @media (max-width: 520px) {
      thead th:nth-child(n+5) { display: none; }
      tbody td:nth-child(n+5) { display: none; }
    }
  </style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo"></div>
    <div>
      <h1>GITAM <span>Results</span></h1>
      <p>Grade card lookup · no login required</p>
    </div>
  </header>

  <div class="card">
    <div style="margin-bottom:1.1rem">
      <label for="regNo">Registration Number</label>
      <input id="regNo" type="text" placeholder="e.g. 2023001075" autocomplete="off" spellcheck="false" />
    </div>
    <div>
      <label>Semester</label>
      <div class="sem-grid" id="semGrid"></div>
    </div>
    <button class="btn" id="fetchBtn" onclick="fetchResults()">
      <svg id="btnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      Search Results
    </button>
    <div class="status-bar" id="statusBar"></div>
  </div>

  <div id="results"></div>

  <footer>Fetches via gitamite.my · Data belongs to GITAM University</footer>
</div>

<script>
  const API = "http://localhost:5000/api/results";
  let selectedSem = null;

  const grid = document.getElementById("semGrid");
  for (let i = 1; i <= 8; i++) {
    const p = document.createElement("div");
    p.className = "sem-pill";
    p.textContent = `Sem ${i}`;
    p.onclick = () => {
      document.querySelectorAll(".sem-pill").forEach(x => x.classList.remove("active"));
      p.classList.add("active");
      selectedSem = i;
    };
    grid.appendChild(p);
  }

  function gradeChip(g) {
    if (!g || g === "-") return `<span class="g g-dash">—</span>`;
    const map = { "O":"g-O","A+":"g-Ap","A":"g-A","B+":"g-Bp","B":"g-B","C":"g-C","F":"g-F","W":"g-F","AB":"g-F" };
    const cls = map[g.toUpperCase()] || "g-dash";
    return `<span class="g ${cls}">${esc(g)}</span>`;
  }

  function catBadge(c) {
    return `<span class="cat-badge cat-${esc(c)}">${esc(c)}</span>`;
  }

  async function fetchResults() {
    const reg = document.getElementById("regNo").value.trim();
    const btn = document.getElementById("fetchBtn");
    const icon = document.getElementById("btnIcon");
    const out = document.getElementById("results");

    if (!reg) { showStatus("error", "Please enter a registration number."); return; }
    if (!selectedSem) { showStatus("error", "Please select a semester."); return; }

    btn.disabled = true; btn.classList.add("loading");
    icon.innerHTML = '<path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>';
    showStatus("loading", `Fetching Semester ${selectedSem} results for ${reg}…`);
    out.innerHTML = "";

    try {
      const resp = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reg, sem: selectedSem }),
      });
      const data = await resp.json();
      if (data.error) { showStatus("error", `❌ ${data.error}`); }
      else { hideStatus(); render(data); }
    } catch (e) {
      showStatus("error", "❌ Cannot connect to backend. Is server.py running?");
    } finally {
      btn.disabled = false; btn.classList.remove("loading");
      icon.innerHTML = '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>';
    }
  }

  function render(d) {
    const out = document.getElementById("results");
    const sessional = d.sessional_table || [];
    const semTable = d.sem_table || [];
    const internal = d.internal_marks || [];
    const isSessional = d.result_type === "sessional" || (sessional.length > 0 && semTable.length === 0);

    let html = `<div class="fade-in">`;

    html += `<div class="student-banner">
      <div class="student-name-big">${esc(d.student_name || "—")}</div>
      <div class="student-meta">${esc(d.regid || "")} &nbsp;·&nbsp; Semester ${esc(String(d.semid || ""))} &nbsp;·&nbsp; ${isSessional ? "Sessional" : "Semester"} Results</div>
      <div class="student-pills">
        <div class="spill">SGPA <strong>${esc(String(d.sgpa || "N/A"))}</strong></div>
        <div class="spill">CGPA <strong>${esc(String(d.cgpa || "N/A"))}</strong></div>
        <div class="spill highlight">Credits <strong>Unlimited</strong></div>
      </div>
    </div>`;

    if (sessional.length > 0) {
      html += `<div class="section-title">Sessional Marks</div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Course</th><th>Cat</th>
          <th>S1 Grade</th><th>S1 Marks</th>
          <th>S2 Grade</th><th>S2 Marks</th>
          <th>Final</th>
        </tr></thead>
        <tbody>`;
      for (const r of sessional) {
        html += `<tr>
          <td>
            <div class="course-name">${esc(r.course_name)}</div>
            <span class="code-badge">${esc(r.course_code)}</span>
          </td>
          <td>${catBadge(r.category)}</td>
          <td>${gradeChip(r.s1_grade)} <span style="font-size:.7rem;color:var(--muted)">${esc(r.s1_month||"")} ${esc(String(r.s1_year||""))}</span></td>
          <td style="font-family:var(--mono)">${esc(String(r.s1_marks||"—"))}</td>
          <td>${gradeChip(r.s2_grade)} <span style="font-size:.7rem;color:var(--muted)">${esc(r.s2_month||"")} ${esc(String(r.s2_year||""))}</span></td>
          <td style="font-family:var(--mono)">${esc(String(r.s2_marks||"—"))}</td>
          <td>${gradeChip(r.final_grade)}</td>
        </tr>`;
      }
      html += `</tbody></table></div>`;
    }

    if (semTable.length > 0) {
      html += `<div class="section-title">Final Grades</div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Course</th><th>Cat</th><th>Credits</th>
          <th>Grade</th><th>Grade Points</th>
        </tr></thead>
        <tbody>`;
      for (const r of semTable) {
        html += `<tr>
          <td>
            <div class="course-name">${esc(r.course_name || r.subject_name || "")}</div>
            <span class="code-badge">${esc(r.course_code || r.subject_code || "")}</span>
          </td>
          <td>${catBadge(r.category || "—")}</td>
          <td style="font-family:var(--mono)">Unlimited</td>
          <td>${gradeChip(r.grade || r.final_grade)}</td>
          <td style="font-family:var(--mono)">${esc(String(r.grade_points||"—"))}</td>
        </tr>`;
      }
      html += `</tbody></table></div>`;
    }

    if (internal.length > 0) {
      html += `<div class="section-title">Internal Marks</div><div class="int-grid">`;
      for (const m of internal) {
        const val = m.internal_marks;
        const isGrade = /^[A-FO][+]?$/.test((val||"").trim());
        html += `<div class="int-cell">
          <div>
            <div class="int-name">${esc(m.subject_name)}</div>
            <div class="int-code">${esc(m.subject_code)}</div>
          </div>
          ${isGrade ? gradeChip(val) : `<div class="int-mark" style="color:var(--accent)">${esc(String(val))}</div>`}
        </div>`;
      }
      html += `</div>`;
    }

    html += `</div>`;
    out.innerHTML = html;
  }

  function showStatus(t, m) { const b = document.getElementById("statusBar"); b.className = `status-bar ${t}`; b.textContent = m; }
  function hideStatus() { document.getElementById("statusBar").className = "status-bar"; }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  document.getElementById("regNo").addEventListener("keydown", e => { if (e.key === "Enter") fetchResults(); });
</script>
</body>
</html>
